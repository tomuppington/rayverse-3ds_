name: Build 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Save the built file
        uses: actions/upload-artifact@v4
        with:
          name: rayverse3ds
          path: rayverse3ds.3dsx
